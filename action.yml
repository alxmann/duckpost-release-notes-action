name: "DuckPost Release Notes"
description: "Requests DuckPost release note generation for pull requests and production branch updates."
author: "DuckPost"

inputs:
  production-branch:
    description: "Production branch that pull requests target, for example main."
    required: true
  duckpost-endpoint:
    description: "DuckPost backend endpoint that accepts release note generation requests."
    required: false
    default: "https://duckpost.app/api/ai-release-jobs"
  include-diff-metadata:
    description: "Collect local git diff metadata. Requires actions/checkout fetch-depth: 0 for full history."
    required: false
    default: "true"
  timeout-ms:
    description: "Request timeout in milliseconds."
    required: false
    default: "30000"

runs:
  using: "node20"
  main: "dist/index.js"
